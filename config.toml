# SoundCore-Desktop configuration
#
# One [[devices]] block per device. Every time a device connects, its current
# settings are READ from the device and stored as that device's `profile` —
# the fetch is read-only and never writes anything to the device. You can edit
# all of this from the tray popup (left-click the tray icon): live controls
# write the single setting you change, and "Apply now" pushes the whole
# stored profile. Unknown setting ids are reported with a clear message.

# Start automatically at logon (toggle from the popup's "Run at startup" checkbox).
autostart = true

[[devices]]
name = "R50i NC"
mac_address = "34:09:C9:B9:EC:30"
model = "SoundcoreA3959"
poll_seconds = 5
apply_delay_seconds = 2 # seconds to wait after connect before reading the device's settings
color = "1"

[[devices.profile]]
id = "gamingMode"
value = "true"

[[devices.profile]]
id = "ambientSoundMode"
value = "Normal"
