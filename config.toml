# SoundCore-Desktop configuration
#
# One [[devices]] block per device. Each device's `profile` is pushed to it every time it
# connects to this PC (unless apply_profile_on_connect = false). You can edit all of this
# from the tray popup (left-click the tray icon) instead — including picking settings with
# live controls while the device is connected. Unknown setting ids are reported with a
# clear message when applied.
#
# Setting apply_profile_on_connect = false makes the app push nothing on connect; use it to
# check whether a profile is behind a device misbehaving (e.g. a microphone that stopped
# working) — manual "Apply now" still works.

# Start automatically at logon (toggle from the popup's "Run at startup" checkbox).
autostart = true

[[devices]]
name = "R50i NC"
mac_address = "34:09:C9:B9:EC:30"
model = "SoundcoreA3959"
poll_seconds = 5
apply_delay_seconds = 2
apply_profile_on_connect = true
color = "1"

[[devices.profile]]
id = "gamingMode"
value = "true"

[[devices.profile]]
id = "ambientSoundMode"
value = "Normal"
