<svg xmlns="http://www.w3.org/2000/svg" width="822" height="1164" viewBox="0 0 411 582" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="0.55" stop-color="#141a2e"/>
      <stop offset="1" stop-color="#1b1033"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.2" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#ff7a45" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff7a45" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#5b8cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="panelStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3354"/>
      <stop offset="1" stop-color="#1a2038"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="btnGlow" x="-30%" y="-50%" width="160%" height="220%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6d6cff" flood-opacity="0.55"/>
    </filter>
    <style>
      text { font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <!-- backdrop -->
  <rect width="411" height="582" fill="url(#bg)"/>
  <rect width="411" height="582" fill="url(#glowA)"/>
  <rect width="411" height="582" fill="url(#glowB)"/>

  <!-- glass panel -->
  <rect x="14" y="14" width="383" height="554" rx="28" fill="url(#panel)" stroke="url(#panelStroke)" stroke-width="1" filter="url(#shadow)"/>

  <!-- header -->
  <g>
    <rect x="30" y="34" width="36" height="36" rx="12" fill="#5b8cff" fill-opacity="0.18" stroke="#5b8cff" stroke-opacity="0.5"/>
    <!-- bluetooth glyph -->
    <path d="M42 46 L54 58 L48 64 L48 40 L54 46 L42 58" fill="none" stroke="#9db8ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="78" y="52" font-size="19" font-weight="700" fill="#ffffff">My Devices</text>
    <text x="78" y="68" font-size="11.5" fill="#ffffff" fill-opacity="0.55">Pick a device to connect and control</text>
    <!-- settings dot button -->
    <circle cx="368" cy="52" r="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
    <circle cx="361" cy="52" r="1.8" fill="#fff" fill-opacity="0.8"/>
    <circle cx="368" cy="52" r="1.8" fill="#fff" fill-opacity="0.8"/>
    <circle cx="375" cy="52" r="1.8" fill="#fff" fill-opacity="0.8"/>
  </g>

  <line x1="30" y1="90" x2="381" y2="90" stroke="#fff" stroke-opacity="0.08"/>

  <!-- section label -->
  <text x="32" y="114" font-size="10.5" font-weight="600" letter-spacing="1.4" fill="#ffffff" fill-opacity="0.45">PAIRED</text>

  <!-- device card -->
  <g filter="url(#soft)">
    <rect x="28" y="124" width="355" height="104" rx="20" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
  </g>
  <!-- icon tile -->
  <rect x="42" y="138" width="56" height="56" rx="16" fill="url(#iconBg)" stroke="#ffffff" stroke-opacity="0.15"/>
  <!-- earbud icon -->
  <g transform="translate(70,166)" fill="none" stroke="#c9d6ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-7 -10 a7 7 0 1 1 7 7 v9 a3 3 0 0 1 -6 0"/>
    <circle cx="-7" cy="-10" r="1" fill="#c9d6ff"/>
    <path d="M10 -4 a5 5 0 0 1 0 8" opacity="0.6"/>
    <path d="M14 -8 a10 10 0 0 1 0 16" opacity="0.35"/>
  </g>

  <text x="112" y="159" font-size="15.5" font-weight="700" fill="#ffffff">soundcore R60i NC</text>
  <text x="112" y="176" font-size="11" fill="#ffffff" fill-opacity="0.5">Wireless earbuds · Noise cancelling</text>

  <!-- status chip -->
  <rect x="112" y="186" width="104" height="20" rx="10" fill="#ff6b6b" fill-opacity="0.14" stroke="#ff6b6b" stroke-opacity="0.4"/>
  <circle cx="126" cy="196" r="3.5" fill="#ff6b6b"/>
  <text x="136" y="199.8" font-size="10.5" font-weight="600" fill="#ff9a9a">Not Connected</text>

  <!-- connect button -->
  <g filter="url(#btnGlow)">
    <rect x="304" y="168" width="64" height="30" rx="15" fill="url(#btn)"/>
  </g>
  <text x="336" y="187" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Connect</text>

  <!-- ghost helper card -->
  <rect x="28" y="244" width="355" height="64" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-dasharray="5 5"/>
  <circle cx="60" cy="276" r="14" fill="#ffffff" fill-opacity="0.08"/>
  <path d="M60 269 v14 M53 276 h14" stroke="#fff" stroke-opacity="0.8" stroke-width="2" stroke-linecap="round"/>
  <text x="84" y="272" font-size="12.5" font-weight="600" fill="#ffffff" fill-opacity="0.9">Add a new device</text>
  <text x="84" y="288" font-size="10.5" fill="#ffffff" fill-opacity="0.45">Put your device in pairing mode to find it</text>

  <!-- footer -->
  <rect x="28" y="508" width="355" height="42" rx="21" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
  <circle cx="52" cy="529" r="4" fill="#4ade80"/>
  <circle cx="52" cy="529" r="8" fill="#4ade80" fill-opacity="0.2"/>
  <text x="68" y="533" font-size="11.5" fill="#ffffff" fill-opacity="0.7">Bluetooth is on · Scanning…</text>
  <text x="366" y="533" font-size="11.5" font-weight="600" fill="#9db8ff" text-anchor="end">Refresh</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
