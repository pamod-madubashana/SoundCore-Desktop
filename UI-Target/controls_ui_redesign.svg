  <circle cx="162" cy="43" r="8" fill="#4ade80" fill-opacity="0.2"/>
  <text x="98" y="62" font-size="10.5" fill="#fff" fill-opacity="0.5">Connected · Soundcore</text>

  <!-- battery pills -->
