  <rect x="38" y="275" width="28" height="28" rx="9" fill="#5b8cff" fill-opacity="0.2"/>
  <path d="M46 289 v0 M50 283 v12 M54 286 v6 M58 281 v16" stroke="#9db8ff" stroke-width="2" stroke-linecap="round"/>
  <text x="78" y="293" font-size="13" font-weight="700" fill="#fff">Sound Effects</text>
  <text x="168" y="293" font-size="11" fill="#fff" fill-opacity="0.5">Soundcore Signature</text>
  <path d="M368 284 L374 289 L368 294" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

