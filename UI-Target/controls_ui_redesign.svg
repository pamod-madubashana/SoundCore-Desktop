  <rect x="26" y="324" width="361" height="206" rx="20" fill="#fff" fill-opacity="0.05" stroke="#fff" stroke-opacity="0.12"/>

  <!-- row 1 ON -->
  <text x="42" y="346" class="row">Wind Noise Suppression</text>
  <rect x="337" y="333" width="38" height="20" rx="10" fill="url(#accent)"/>
  <circle cx="365" cy="343" r="7.5" fill="#fff"/>
  <line x1="40" x2="373" y1="358" y2="358" class="sep"/>

