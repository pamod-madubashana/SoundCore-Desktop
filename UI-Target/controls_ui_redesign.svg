  <path d="M365 35 L375 45 M375 35 L365 45" stroke="#fff" stroke-opacity="0.75" stroke-width="1.8" stroke-linecap="round"/>

  <!-- ===== Mode card ===== -->
  <rect x="26" y="106" width="361" height="148" rx="22" fill="#fff" fill-opacity="0.06" stroke="#fff" stroke-opacity="0.12"/>

  <!-- ANC row -->
  <rect x="36" y="116" width="341" height="40" rx="14" fill="#000" fill-opacity="0.28"/>
  <rect x="38" y="118" width="109" height="36" rx="12" fill="url(#accent)" filter="url(#glow)"/>
  <text x="92" y="141" class="segA">Noise Cancel</text>
  <text x="207" y="141" class="seg">Normal</text>
  <text x="322" y="141" class="seg">Transparency</text>

