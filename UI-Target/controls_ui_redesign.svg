  <rect x="337" y="469" width="38" height="20" rx="10" fill="#fff" fill-opacity="0.15"/>
  <circle cx="347" cy="479" r="7.5" fill="#fff" fill-opacity="0.8"/>
  <line x1="40" x2="373" y1="494" y2="494" class="sep"/>

  <!-- row 6 ON -->
  <text x="42" y="516" class="row">Touch Tone</text>
  <rect x="337" y="503" width="38" height="20" rx="10" fill="url(#accent)"/>
