<svg xmlns="http://www.w3.org/2000/svg" width="826" height="1160" viewBox="0 0 413 580" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="0.55" stop-color="#141a2e"/>
      <stop offset="1" stop-color="#1b1033"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.15" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#ff7a45" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ff7a45" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.05" r="0.6">
      <stop offset="0" stop-color="#5b8cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="panelStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3354"/>
      <stop offset="1" stop-color="#1a2038"/>
    </linearGradient>
    <linearGradient id="batt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-30%" y="-50%" width="160%" height="220%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#6d6cff" flood-opacity="0.6"/>
    </filter>
    <style>
      text { font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; }
      .seg { font-size: 11.5px; font-weight: 600; fill: #ffffff; fill-opacity: 0.55; text-anchor: middle; }
      .segA { font-size: 11.5px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .row { font-size: 12.5px; font-weight: 500; fill: #ffffff; fill-opacity: 0.88; }
      .sep { stroke: #ffffff; stroke-opacity: 0.07; }
    </style>
  </defs>

  <rect width="413" height="580" fill="url(#bg)"/>
  <rect width="413" height="580" fill="url(#glowA)"/>
  <rect width="413" height="580" fill="url(#glowB)"/>

  <!-- panel -->
  <rect x="12" y="12" width="389" height="556" rx="28" fill="url(#panel)" stroke="url(#panelStroke)" filter="url(#shadow)"/>

  <!-- header -->
  <rect x="26" y="26" width="58" height="52" rx="16" fill="url(#iconBg)" stroke="#fff" stroke-opacity="0.14"/>
  <!-- earbuds -->
  <g fill="#0d1020" stroke="#c9d6ff" stroke-width="1.6" stroke-linecap="round">
    <ellipse cx="45" cy="46" rx="8" ry="9"/>
    <path d="M40 54 L37 68" />
    <ellipse cx="65" cy="46" rx="8" ry="9"/>
    <path d="M70 54 L73 68"/>
  </g>
  <text x="98" y="48" font-size="18" font-weight="700" fill="#fff">R60i NC</text>
