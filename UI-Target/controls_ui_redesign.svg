    <rect x="10" y="5" width="9" height="10" rx="3" fill="none" stroke="#9db8ff" stroke-width="1.3"/>
    <rect x="24" y="6" width="22" height="9" rx="3" fill="#fbbf24"/>
    <text x="50" y="14" font-size="10.5" font-weight="600" fill="#fff">70%</text>
  </g>

