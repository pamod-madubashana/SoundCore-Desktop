    <text x="10" y="14" font-size="9.5" font-weight="700" fill="#9db8ff">R</text>
    <rect x="22" y="6" width="22" height="9" rx="3" fill="url(#batt)"/>
    <text x="50" y="14" font-size="10.5" font-weight="600" fill="#fff">100%</text>
  </g>
  <g transform="translate(286,70)">
