<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: transparent; overflow: hidden; height: 100%; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .toast {
      display: flex; align-items: center; gap: 14px; height: 100%;
      padding: 14px 20px; border-radius: 14px;
      background: rgba(30, 30, 38, 0.95);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.06);
      animation: slide-in 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .icon {
      width: 52px; height: 52px; border-radius: 12px; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; color: oklch(0.78 0.16 195);
    }
    .icon img { width: 100%; height: 100%; object-fit: cover; }
    .icon svg { width: 36px; height: 36px; }
    .info { min-width: 0; }
    .name { font-size: 14px; font-weight: 600; color: #f0f0f0; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
    .status { font-size: 12px; font-weight: 500; margin-top: 2px; }
    .status.connected { color: oklch(0.78 0.16 160); }
    .status.disconnected { color: oklch(0.65 0.22 25); }
    .batteries { display: flex; gap: 14px; margin-top: 6px; }
    .bat { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #ccc; font-weight: 500; }
    .bat-label { font-weight: 700; color: #999; font-size: 11px; }
    .bat-icon { flex-shrink: 0; }
    @keyframes slide-in {
      from { opacity: 0; transform: translateY(10px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body>
  <div class="toast" id="toast">
    <div class="icon" id="icon"></div>
    <div class="info">
      <div class="name" id="name"></div>
      <div class="status" id="status"></div>
      <div class="batteries" id="batteries"></div>
    </div>
  </div>
  <script>
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;

    function batColor(pct) {
      if (pct > 50) return "#4ade80";
      if (pct > 20) return "#facc15";
      return "#f87171";
    }

    function batteryIcon(pct) {
      const c = batColor(pct);
      const fillW = Math.round(13 * pct / 100);
      return '<svg class="bat-icon" width="20" height="12" viewBox="0 0 18 11" fill="none">' +
        '<rect x="0.5" y="0.5" width="15" height="10" rx="2" stroke="' + c + '" stroke-width="1" opacity="0.4"/>' +
        '<rect x="16" y="3" width="2" height="5" rx="0.5" fill="' + c + '" opacity="0.4"/>' +
        '<rect x="1.5" y="1.5" width="' + fillW + '" height="8" rx="1" fill="' + c + '"/>' +
        '</svg>';
    }

    function renderBatteries(battery) {
      const el = document.getElementById("batteries");
      if (!battery) { el.innerHTML = ""; return; }
      const items = [];
      if (battery.left != null) items.push(["L", battery.left]);
      if (battery.right != null) items.push(["R", battery.right]);
      if (items.length === 0 && battery.combined != null) items.push(["", battery.combined]);
      if (battery.case != null) items.push(["Case", battery.case]);
      if (items.length === 0) { el.innerHTML = ""; return; }
      el.innerHTML = items.map(([label, pct]) =>
        '<div class="bat">' +
          (label ? '<span class="bat-label">' + label + '</span>' : '') +
          batteryIcon(pct) +
          '<span>' + pct + '%</span>' +
        '</div>'
      ).join("");
    }

    function applyNotification(data) {
      if (!data) return;
      const { name, image, status, battery } = data;
      document.getElementById("name").textContent = (name || "").replace(/^soundcore\s+/i, "");
      const statusEl = document.getElementById("status");
      statusEl.textContent = status || "Connected";
      statusEl.className = "status " + (status === "Disconnected" ? "disconnected" : "connected");
      renderBatteries(battery);
      const icon = document.getElementById("icon");
      if (image) {
        icon.innerHTML = '<img src="' + image + '" />';
      } else {
        icon.innerHTML = '<svg viewBox="0 0 479 479" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M 287 140 L 271 147 L 262 153 L 253 161 L 242 176 L 235 194 L 233 203 L 233 211 L 232 212 L 233 231 L 236 242 L 245 259 L 258 273 L 272 283 L 286 290 L 299 294 L 303 297 L 311 326 L 314 333 L 314 336 L 324 366 L 324 369 L 327 376 L 327 379 L 330 386 L 330 389 L 343 429 L 343 432 L 346 441 L 352 452 L 359 459 L 365 463 L 377 467 L 391 467 L 402 464 L 413 458 L 418 453 L 424 443 L 427 432 L 427 415 L 425 405 L 422 396 L 422 392 L 418 379 L 418 375 L 414 362 L 414 358 L 403 313 L 415 309 L 431 300 L 444 288 L 450 280 L 457 265 L 460 250 L 460 238 L 457 224 L 448 207 L 437 195 L 427 188 L 417 183 L 402 179 L 396 171 L 386 161 L 377 154 L 363 146 L 344 139 L 328 137 L 327 136 L 306 136 Z"/><path d="M 189 25 L 175 22 L 149 22 L 127 27 L 111 34 L 100 41 L 89 50 L 76 65 L 61 69 L 51 74 L 39 83 L 29 95 L 22 109 L 19 122 L 19 139 L 21 148 L 27 163 L 34 173 L 43 182 L 56 191 L 75 199 L 75 204 L 53 294 L 51 310 L 52 311 L 53 324 L 58 335 L 65 343 L 77 350 L 89 353 L 105 352 L 118 346 L 127 337 L 134 323 L 134 320 L 138 310 L 138 307 L 141 300 L 141 297 L 144 290 L 144 287 L 151 267 L 151 264 L 154 257 L 154 254 L 157 247 L 157 244 L 160 237 L 160 234 L 163 227 L 163 224 L 167 214 L 167 211 L 176 182 L 179 180 L 192 176 L 208 168 L 218 161 L 235 143 L 243 127 L 246 115 L 246 91 L 243 77 L 238 64 L 226 47 L 217 39 L 208 33 Z"/></svg>';
      }
    }

    invoke("get_notification").then(applyNotification);
    listen("notification-show", (e) => applyNotification(e.payload));
  </script>
</body>
</html>
