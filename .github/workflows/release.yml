name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0). Defaults to Cargo.toml version.'
        required: false
        type: string

jobs:
  build:
    name: Build release bundles
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install native dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            build-essential \
            libglib2.0-dev \
            libgtk-3-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libasound2-dev \
            libxcb1-dev \
            libx11-dev

      - name: Verify version consistency
        shell: bash
        run: |
          set -e
          cargo_ver="$(sed -n -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -n1)"
          cargo_ver="${cargo_ver#v}"
          echo "Versions: Cargo.toml=$cargo_ver"
          if [ -n "${{ inputs.version }}" ]; then
            input="${{ inputs.version }}"
            input="${input#v}"
            if [ "$input" != "$cargo_ver" ]; then
              echo "::error::Input version '${{ inputs.version }}' does not match Cargo.toml ($cargo_ver). Bump version first."
              exit 1
            fi
          fi

      - name: Build release binary
        run: cargo build --release

      - name: Prepare release assets
        shell: bash
        run: |
          set -e
          mkdir -p release-assets
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp target/release/soundcore-desktop release-assets/SoundCore-Desktop-linux-x86_64
          else
            cp target/release/soundcore-desktop.exe release-assets/SoundCore-Desktop.exe
          fi
          ls -lh release-assets/

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.os }}
          path: release-assets/**

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          set -e
          if [ -n "${{ inputs.version }}" ]; then
            tag="${{ inputs.version }}"
          else
            cargo_ver="$(sed -n -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -n1)"
            tag="v$cargo_ver"
          fi
          case "$tag" in
            v*) ;;
            *) tag="v$tag";;
          esac
          file_ver="$(sed -n -E 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -n1)"
          file_ver="v${file_ver#v}"
          if [ "$tag" != "$file_ver" ]; then
            echo "::error::Release tag $tag does not match Cargo.toml ($file_ver). Bump version first."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create release and upload assets
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          artifacts: "release-assets/**/*"
          generateReleaseNotes: true
          allowUpdates: true
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
